name: grading-network
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - pytorch-cuda=12.1        # comment this out if on CPU only
  - triton=3.1.0
  - numpy
  - pandas
  - pyarrow=21.0.0
  - duckdb
  - pyyaml
  - regex
  - tqdm
  - pip
  - pip:
      - transformers
      - tokenizers
      - safetensors
      - datasets
      - huggingface_hub
